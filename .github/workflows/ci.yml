name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: quiz
          POSTGRES_PASSWORD: quiz
          POSTGRES_DB: quiz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quiz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://quiz:quiz@localhost:5432/quiz?schema=public
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_ACCESS_EXPIRES_IN_SECONDS: '900'
      JWT_EMAIL_VERIFICATION_SECRET: ci-email-verification-secret
      WEB_ORIGIN: http://localhost:5173
      PORT: '3000'
      VITE_API_BASE_URL: http://localhost:3000/api/v1

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm exec prettier --check .

      - name: Build
        run: pnpm build

      # `pnpm db:migrate` (= `prisma migrate dev`) est pensé pour le développement
      # local (peut créer/nommer une migration de façon interactive). En CI, on
      # applique les migrations déjà commitées de façon non interactive.
      - name: Apply database migrations
        run: pnpm --filter @quiz/api exec prisma migrate deploy

      - name: Seed database
        run: pnpm db:seed

      - name: Unit tests
        run: pnpm test

      - name: API integration tests
        run: pnpm --filter @quiz/api test:e2e

      - name: Install Playwright browsers
        run: pnpm --filter @quiz/web exec playwright install --with-deps chromium

      - name: E2E tests (Playwright)
        run: pnpm --filter @quiz/web test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
